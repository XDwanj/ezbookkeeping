name: Build and Publish GHCR Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set build variables
        id: variables
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "build_unix_time=$(date -u '+%s')" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u '+%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.variables.outputs.image }}
          tags: |
            type=raw,value=latest-snapshot,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: image-all
          push: true
          set: |
            *.args.RELEASE_BUILD=${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
            *.args.BUILD_PIPELINE=1
            *.args.BUILD_UNIXTIME=${{ steps.variables.outputs.build_unix_time }}
            *.args.BUILD_DATE=${{ steps.variables.outputs.build_date }}
            *.args.BUILD_NODE_OPTIONS=${{ vars.BUILD_NODE_OPTIONS }}
            *.args.CHECK_3RD_API=${{ vars.CHECK_3RD_API }}
            *.args.SKIP_TESTS=${{ vars.SKIP_TESTS }}
            *.cache-from=type=gha,scope=ghcr
            *.cache-to=type=gha,mode=max,scope=ghcr
